# Stages this n8n community node to npm on every version tag push, using OIDC
# Trusted Publishing — no long-lived npm token. The staged version is NOT public
# until a maintainer approves it with a 2FA challenge, so publishing is gated by
# a human. Provenance is generated automatically (an n8n verification
# requirement) because the stage runs via OIDC from this repo/workflow.
#
# ONE-TIME SETUP (already done): on npmjs.com, the package's Trusted Publisher is
# configured for GitHub Actions -> owner "auphonic", repo "n8n-nodes-auphonic",
# workflow "publish.yml", allowed action "npm stage publish". No NPM_TOKEN secret
# is needed or used.
#
# RELEASE PROCESS:
#   1. Bump the version in package.json and commit it.
#   2. git tag v0.1.1 && git push origin v0.1.1
#      -> this workflow lints, builds, and STAGES the version (not yet public).
#   3. Review it: npmjs.com -> package -> Staged Packages (or `npm stage list` /
#      `npm stage view <id>`).
#   4. Approve to publish:  npm stage approve <id>   (completes the 2FA challenge)
#      or discard:          npm stage reject <id>

name: Publish

on:
  push:
    tags:
      # Matches both 0.1.0 and v0.1.0 style tags.
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:

jobs:
  stage:
    name: Stage to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for OIDC trusted publishing + provenance
      contents: read # least-privilege

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Upgrade npm for trusted publishing + staging
        # OIDC trusted publishing needs npm >= 11.5.1; `npm stage` needs >= 11.18.
        # Node's bundled npm is 10.x, so pull the latest.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Stage to npm (OIDC; provenance automatic; awaits 2FA approval)
        # RELEASE_MODE bypasses the prepublishOnly guard (n8n-node prerelease),
        # which fires on `npm stage publish` just like a direct publish.
        run: RELEASE_MODE=true npm stage publish --access public
