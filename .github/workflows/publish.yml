# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement: `npm run release` (in CI) runs lint + build, then publishes with
# provenance enabled. Provenance lets anyone cryptographically verify that the
# package was built by this exact workflow, from this exact repository/commit.
#
# ONE-TIME SETUP (Option B — npm automation/granular token):
#   Add an `NPM_TOKEN` repository secret (Settings -> Secrets and variables ->
#   Actions) with publish rights to n8n-nodes-auphonic. It is written to .npmrc
#   below only for the publish step.
#
# TODO(security): migrate to OIDC Trusted Publishing to drop the NPM_TOKEN
#   secret. See https://docs.npmjs.com/trusted-publishers — once configured,
#   leave NPM_TOKEN unset and the token line below becomes a no-op.
#
# RELEASE PROCESS:
#   Run `npm run release` locally to lint, build, bump the version, update the
#   changelog, commit, tag, and push — the tag push triggers this workflow.
#   (You can also tag manually: `git tag v0.1.0 && git push origin v0.1.0`.)

name: Publish

on:
  push:
    tags:
      # Matches both 0.1.0 and v0.1.0 style tags.
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required to mint the OIDC token for npm provenance
      contents: read # least-privilege

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Publishes to npm with provenance. Lint and build run automatically as
        # part of `npm run release` in CI (GITHUB_ACTIONS is set), which also
        # sets RELEASE_MODE so the prepublishOnly guard allows the publish.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
