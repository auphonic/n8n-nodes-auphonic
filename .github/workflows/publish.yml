name: Publish to npm

# Publishes the package to npm with build provenance when a version tag is
# pushed (e.g. `v0.1.0`). Provenance requires publishing from GitHub Actions
# with `id-token: write`, which is also an n8n verification requirement.
#
# Prerequisites:
#   - An `NPM_TOKEN` repository secret containing an npm automation token (or a
#     granular access token with publish rights). An automation token bypasses
#     the interactive 2FA prompt so CI can publish unattended.
#   - This workflow CAN create the package on its first run (a token, unlike
#     OIDC trusted publishing, may publish a brand-new package name). After the
#     first publish, transfer the package to the Auphonic npm org on npmjs.com
#     (package -> Settings -> transfer package) so the org owns it.
#
# TODO(security): migrate to npm Trusted Publishing (OIDC) to drop the
# long-lived NPM_TOKEN secret — see https://docs.npmjs.com/trusted-publishers
#
# Release flow:
#   1. Bump the version in package.json and commit it.
#   2. Tag the commit:  git tag v0.1.0 && git push origin v0.1.0
#   3. This workflow builds, lints, and publishes with provenance.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
